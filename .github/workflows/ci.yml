name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64: scalar / SSE4.2 / AVX x gcc / clang
  # ---------------------------------------------------------------------------
  linux-x86_64:
    name: Linux ${{ matrix.cc }} / ${{ matrix.simd }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   simd: scalar, cflags: "" }
          - { cc: gcc,   simd: sse42,  cflags: "-msse4.2" }
          - { cc: gcc,   simd: avx,    cflags: "-mavx" }
          - { cc: clang, simd: scalar, cflags: "" }
          - { cc: clang, simd: sse42,  cflags: "-msse4.2" }
          - { cc: clang, simd: avx,    cflags: "-mavx" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: make test
        run: |
          make test CC=${{ matrix.cc }} \
            CFLAGS="-Wall -fsanitize=address,undefined ${{ matrix.cflags }}"

  # ---------------------------------------------------------------------------
  # Linux ARM64: native NEON / scalar fallback
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: Linux ARM64 / ${{ matrix.simd }}
    # GitHub-hosted ARM64 runners are available for public repositories.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { simd: neon,    cflags: "" }
          - { simd: no-neon, cflags: "-DPICOHTTPPARSER_NO_NEON" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify NEON backend
        if: matrix.simd == 'neon'
        run: |
          cc -dM -E - < /dev/null | grep -q '__ARM_NEON'
          cc -E picohttpparser.c | grep -q 'findchar_fast_neon'
      - name: Verify scalar fallback
        if: matrix.simd == 'no-neon'
        run: |
          if cc -E picohttpparser.c | grep -q 'findchar_fast_neon'; then
            echo "NEON path unexpectedly enabled"
            exit 1
          fi
      - name: make test
        run: |
          make test CFLAGS="-Wall -fsanitize=address,undefined ${{ matrix.cflags }}"

  # ---------------------------------------------------------------------------
  # macOS Apple Silicon: NEON / scalar fallback
  # ---------------------------------------------------------------------------
  macos-arm64:
    name: macOS ARM64 / NEON
    # Scalar fallback is covered by the Linux ARM64 job to reduce macOS usage.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - { simd: neon, cflags: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: make test
        run: |
          make test CFLAGS="-Wall -fsanitize=address,undefined ${{ matrix.cflags }}"

  # ---------------------------------------------------------------------------
  # Windows MSVC: x64 with /arch:AVX
  # test.c uses POSIX mmap/sysconf, so use a portable smoke test instead.
  # ---------------------------------------------------------------------------
  windows-msvc:
    name: Windows MSVC / x64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, simd: "/arch:AVX", execute: true }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Create smoke test
        shell: pwsh
        run: |
          $src = @'
          #include <string.h>
          #include "picohttpparser.h"

          int main(void)
          {
              static const char req[] =
                  "GET / HTTP/1.1\r\nHost: example.com\r\nCookie: a=b\r\n\r\n";
              struct phr_header headers[8];
              const char *method, *path;
              size_t method_len, path_len, num_headers = 8;
              int minor_version;
              int ret = phr_parse_request(req, sizeof(req) - 1, &method, &method_len,
                                          &path, &path_len, &minor_version,
                                          headers, &num_headers, 0);
              if (ret != (int)(sizeof(req) - 1))
                  return 1;
              if (method_len != 3 || memcmp(method, "GET", 3) != 0)
                  return 2;
              if (path_len != 1 || path[0] != '/')
                  return 3;
              if (num_headers != 2)
                  return 4;
              return 0;
          }
          '@
          Set-Content -Encoding ascii smoke.c -Value $src
      - name: Build smoke test
        shell: cmd
        run: cl /nologo /W3 /O2 ${{ matrix.simd }} picohttpparser.c smoke.c /Fe:smoke.exe
      - name: Run smoke test
        if: matrix.execute
        shell: cmd
        run: smoke.exe

  # ---------------------------------------------------------------------------
  # Windows MinGW: gcc / clang x scalar / SSE4.2
  # ---------------------------------------------------------------------------
  windows-mingw:
    name: Windows MinGW ${{ matrix.cc }} / ${{ matrix.simd }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   simd: scalar, cflags: "" }
          - { cc: gcc,   simd: sse42,  cflags: "-msse4.2" }
          - { cc: clang, simd: scalar, cflags: "" }
          - { cc: clang, simd: sse42,  cflags: "-msse4.2" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-clang
      - name: Build and run smoke test
        shell: msys2 {0}
        run: |
          cat > smoke.c <<'EOF'
          #include <string.h>
          #include "picohttpparser.h"

          int main(void)
          {
              static const char req[] =
                  "GET / HTTP/1.1\r\nHost: example.com\r\nCookie: a=b\r\n\r\n";
              struct phr_header headers[8];
              const char *method, *path;
              size_t method_len, path_len, num_headers = 8;
              int minor_version;
              int ret = phr_parse_request(req, sizeof(req) - 1, &method, &method_len,
                                          &path, &path_len, &minor_version,
                                          headers, &num_headers, 0);
              if (ret != (int)(sizeof(req) - 1))
                  return 1;
              if (method_len != 3 || memcmp(method, "GET", 3) != 0)
                  return 2;
              if (path_len != 1 || path[0] != '/')
                  return 3;
              if (num_headers != 2)
                  return 4;
              return 0;
          }
          EOF
          ${{ matrix.cc }} -std=c99 -Wall -Wextra ${{ matrix.cflags }} \
            picohttpparser.c smoke.c -o smoke.exe
          ./smoke.exe

  # ---------------------------------------------------------------------------
  # ARMv7: compile-only, verifies scalar fallback
  # ---------------------------------------------------------------------------
  armv7-cross:
    name: ARMv7 cross-compile (scalar fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARMv7 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Compile library
        run: |
          arm-linux-gnueabihf-gcc -std=c99 -Wall -Wextra \
            -c picohttpparser.c -o /tmp/picohttpparser-armv7.o

  # ---------------------------------------------------------------------------
  # Bench: x86_64 scalar vs SSE4.2
  # bench.c parses a fixed request 10M times; compare best-of-3 wall time.
  # ---------------------------------------------------------------------------
  bench-x86_64:
    name: Bench x86_64 (scalar vs SSE4.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          cc -O2 -o bench-scalar bench.c picohttpparser.c
          cc -O2 -msse4.2 -o bench-sse42 bench.c picohttpparser.c
      - name: Run and compare
        run: |
          python3 - <<'PY'
          import os, statistics, subprocess, time

          def best(binary, rounds=3):
              samples = []
              for _ in range(rounds):
                  t0 = time.perf_counter()
                  subprocess.run([binary], check=True)
                  samples.append(time.perf_counter() - t0)
              return min(samples), statistics.median(samples)

          s_best, s_med = best("./bench-scalar")
          e_best, e_med = best("./bench-sse42")
          speedup = s_best / e_best
          print(f"scalar best={s_best:.3f}s median={s_med:.3f}s")
          print(f"SSE4.2 best={e_best:.3f}s median={e_med:.3f}s")
          print(f"speedup={speedup:.2f}x")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### x86_64 bench (10M parses)\n")
              f.write("| build | best | median |\n|---|---|---|\n")
              f.write(f"| scalar | {s_best:.3f}s | {s_med:.3f}s |\n")
              f.write(f"| SSE4.2 | {e_best:.3f}s | {e_med:.3f}s |\n")
              f.write(f"| speedup | {speedup:.2f}x | |\n")

          if speedup < 0.90:
              raise SystemExit("SSE4.2 is >10% slower than scalar")
          PY

  # ---------------------------------------------------------------------------
  # Bench: Linux ARM64 scalar vs NEON
  # Moved here from macOS to avoid macOS runner quota/cancellation.
  # ---------------------------------------------------------------------------
  bench-linux-arm64:
    name: Bench Linux ARM64 (scalar vs NEON)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          cc -O2 -DPICOHTTPPARSER_NO_NEON -o bench-scalar bench.c picohttpparser.c
          cc -O2 -o bench-neon bench.c picohttpparser.c
      - name: Run and compare
        run: |
          python3 - <<'PY'
          import os, statistics, subprocess, time

          def best(binary, rounds=3):
              samples = []
              for _ in range(rounds):
                  t0 = time.perf_counter()
                  subprocess.run([binary], check=True)
                  samples.append(time.perf_counter() - t0)
              return min(samples), statistics.median(samples)

          s_best, s_med = best("./bench-scalar")
          e_best, e_med = best("./bench-neon")
          speedup = s_best / e_best
          print(f"scalar best={s_best:.3f}s median={s_med:.3f}s")
          print(f"NEON   best={e_best:.3f}s median={e_med:.3f}s")
          print(f"speedup={speedup:.2f}x")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### ARM64 bench (10M parses)\n")
              f.write("| build | best | median |\n|---|---|---|\n")
              f.write(f"| scalar | {s_best:.3f}s | {s_med:.3f}s |\n")
              f.write(f"| NEON | {e_best:.3f}s | {e_med:.3f}s |\n")
              f.write(f"| speedup | {speedup:.2f}x | |\n")

          # Report-only until the NEON range scan is optimized.
          if speedup < 0.70:
              print("WARNING: NEON is >30% slower than scalar")
          PY
